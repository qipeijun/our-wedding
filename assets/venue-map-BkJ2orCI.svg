<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 64 480 342" role="img" aria-labelledby="map-title map-description">
  <title id="map-title">赣州新饭店周边线条示意图</title>
  <desc id="map-description">依据提供的高德地图截图简化。新饭店位于杨仙大道靠内陆一侧，邻近赣县体育馆、赣县区文体中心，杨仙大道另一侧为滨江公园及贡水。非等比例，不标注主楼、附楼和入口的精确位置。</desc>
  <defs>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#795b51}
      .road{fill:none;stroke:#ab7f6f;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
      .building{fill:none;stroke:#b28c7c;stroke-width:1.2;stroke-linejoin:round}
      .label{font-size:18px;text-anchor:middle}
      .halo{paint-order:stroke;stroke:#f4ebdd;stroke-width:7px;stroke-linejoin:round}
    </style>
    <clipPath id="map-boundary"><rect x="22" y="80" width="436" height="310"/></clipPath>
  </defs>
  <path fill="#f4ebdd" d="M0 0h480v450H0z"/>
  <g clip-path="url(#map-boundary)">
    <!-- 沿原截图保留河岸、临江道路与地标之间的关系；线条经概括，不表达精确距离。 -->
    <path d="M-10 372Q171 361 305 313T493 170L493 404H-10Z" fill="#eadfd0"/>
    <g fill="none" stroke="#bd9d8c" stroke-width="1">
      <path d="M-10 372Q171 361 305 313T493 170"/>
      <path d="M0 389Q184 378 317 329T495 190" opacity=".5"/>
      <path d="M238 386q27-3 51-11m34-11q28-11 49-25m21-15 17-14" opacity=".55"/>
    </g>
    <!-- 杨仙大道沿滨江一侧经过饭店。 -->
    <g class="road">
      <path d="M-10 333Q166 322 290 280T488 130"/>
      <path d="M-10 345Q172 334 296 292T496 139"/>
      <path d="M22 186 291 80M27 198 299 89"/>
      <path d="M77 165 132 323M88 161 143 321"/>
      <path d="M186 122 211 193 236 296M197 118 222 190 247 293"/>
      <path d="M330 80 391 220M341 80 401 213"/>
      <path d="M104 238 221 194 366 139M108 249 225 205 370 150"/>
    </g>
    <text class="label halo" x="139" y="151" transform="rotate(-22 139 151)">城南大道</text>
    <text class="label halo" x="330" y="273" transform="rotate(-24 330 273)" style="fill:#92352e">杨仙大道</text>
    <!-- 只绘制截图中可辨认的周边地标，不虚构酒店楼栋轮廓。 -->
    <g class="building">
      <path d="M128 185q23-13 43-7t13 19q-6 13-27 15t-31-7q-9-10 2-20Z"/>
      <path d="M132 187q18-10 35-5t12 14q-7 10-24 11t-24-7q-5-6 1-13Z" opacity=".5"/>
      <ellipse cx="278" cy="209" rx="23" ry="17" transform="rotate(-20 278 209)"/>
      <ellipse cx="278" cy="209" rx="17" ry="11" transform="rotate(-20 278 209)"/>
      <path d="m162 263 32-10 9 30-32 10Z M166 268l22-7m-19 17 22-7"/>
    </g>
    <text class="label halo" x="150" y="231" style="font-size:16px">梅林古镇</text>
    <text class="label halo" x="285" y="179">赣县体育馆</text>
    <text class="label halo" x="175" y="312" style="font-size:16px">赣县区文体中心</text>
    <path d="M280 244c-7 0-12 5-12 12 0 9 12 20 12 20s12-11 12-20c0-7-5-12-12-12Z" fill="#92352e"/>
    <circle cx="280" cy="255" r="3.5" fill="#f4ebdd"/>
    <path d="m290 248 16-13h71" fill="none" stroke="#92352e" stroke-width="1.3"/>
    <text x="309" y="226" style="fill:#92352e;font-size:24px;font-family:'Songti SC',serif">新饭店</text>
    <text class="label halo" x="205" y="353" style="font-size:16px">樱花锦公园</text>
    <text x="352" y="370" text-anchor="middle" style="font-size:19px;font-family:'Songti SC',serif;letter-spacing:12px;fill:#967f6f" transform="rotate(-23 352 370)">贡水</text>
  </g>
</svg>
